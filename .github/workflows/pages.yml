name: Deploy the watch page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The public site is the watch player only; the studio runs locally (`npm run dev`).
      # Pages serves the site from /<repo>/ (local dev stays at /).
      - run: npm run build:public -- --base /${{ github.event.repository.name }}/
      # Never publish the studio: fail if any of its UI made it into the public build.
      - name: Check the studio is not in the public build
        run: |
          if grep -rlE "Record video|Save snapshot|MediaRecorder" dist; then
            echo "::error::Studio code is in the public build; the site would publish the studio."
            exit 1
          fi
      # single-page app: any other path (an old studio link, /rocksaurus/brand) falls back to the app, which sends it
      # to /watch instead of a 404
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
